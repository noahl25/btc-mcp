<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>MCP WebSocket Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 20px;
        }

        #chat {
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            background: #020617;
            margin-bottom: 10px;
        }

        .user {
            color: #38bdf8;
            margin: 4px 0;
        }

        .bot {
            color: #a7f3d0;
            margin: 4px 0;
            white-space: pre-wrap;
        }

        #controls {
            display: flex;
            gap: 10px;
        }

        input,
        button {
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        input {
            flex: 1;
        }

        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>MCP Streaming Chat Test</h2>

    <label>
        MCP Server Port:
        <input id="port" type="text" value="8123" />
    </label>
    <button onclick="connect()">Connect</button>

    <div id="chat"></div>

    <div id="controls">
        <input id="input" type="text" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let socket = null;
        let currentBotMessage = "";

        const chat = document.getElementById("chat");

        function addLine(text, cls) {
            const div = document.createElement("div");
            div.className = cls;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function connect() {
            const port = document.getElementById("port").value;
            const url = `ws://localhost:8000/ws/chat/${port}`;
            socket = new WebSocket(url);

            socket.onopen = () => {
                addLine("Connected to WebSocket.", "bot");
            };

            socket.onclose = () => {
                addLine("Disconnected.", "bot");
            };

            socket.onerror = (e) => {
                console.error("WebSocket error:", e);
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "start") {
                    currentBotMessage = "";
                    currentBotDiv = addLine("", "bot");
                }

                if (data.type === "token") {
                    currentBotMessage += data.content;
                    currentBotDiv.textContent = currentBotMessage;
                }

                if (data.type === "end") {
                    // message complete
                }
            };
        }

        function sendMessage() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

            addLine("You: " + text, "user");
            socket.send(text);
            input.value = "";
        }

        document.getElementById("input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>

</html>
